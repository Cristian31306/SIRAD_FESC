<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · SIRAD</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        /* Estilos específicos para la página de Login para que se vea centrada y limpia */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
        }
        .login-box {
            background: var(--white);
            padding: 3rem 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }
        .login-box h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .login-box p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .login-box .btn {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>SIRAD</h1>
        <p>Sistema de Control y Trazabilidad de Radicados</p>

        <form action="index.html" method="GET">
            <div class="form-group" style="text-align: left;">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="usuario@nortedesantander.gov.co" required>
            </div>
            
            <div class="form-group" style="text-align: left;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn">Ingresar al Sistema</button>
        </form>
        
        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
            ¿Olvidó su contraseña? Contacte a soporte de TI.
        </p>
    </div>

</body>
</html>
